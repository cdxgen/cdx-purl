name: Verify actions lock

# The lockfile does not cover reusable workflow calls, so this repository
# runs the shared verify workflow from cdxgen/.github at a pinned commit and
# keeps the check required on the default branch. See
# https://docs.github.com/en/actions/concepts/security/workflow-dependency-lockfiles
on:
  pull_request:
    paths:
      - .github/workflows/**
      - '**/action.y*ml'
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - '**/action.y*ml'

permissions:
  contents: read

jobs:
  verify:
    uses: cdxgen/.github/.github/workflows/verify-actions-lock.yml@3ff2219047016d816714783fa5cc6263c2b53ebb  # main
